[package]
name = "fac_test"
version = "0.1.0"
edition = "2021"
description = "BM1684X 工厂产测工具"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_extras = "0.29"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
socket2 = "0.5"
if-addrs = "0.10"
rfd = "0.14"
chrono = "0.4"
